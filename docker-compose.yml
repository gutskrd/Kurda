# Full local stack: docker compose up
# API on :3000, worker, Postgres 16, Redis 7.
# Migrations run first; the API and worker only start after they succeed —
# a failed migration aborts the stack instead of booting on a wrong schema.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kurda
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: npm run migrate:up --workspace api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kurda
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kurda
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: npx tsx api/src/workers/main.ts
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kurda
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
