# Full local stack: docker compose up
# API on :3000, worker, Postgres 16, Redis 7.
# Migrations run first; the API and worker only start after they succeed —
# a failed migration aborts the stack instead of booting on a wrong schema.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kurda
    # bound to localhost so the database is never exposed to the LAN/internet;
    # containers reach it over the internal compose network regardless
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the least-privilege kurda_app role on first init (before migrations)
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # localhost-only: Redis has no auth here and must not be publicly reachable
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: npm run migrate:up --workspace api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kurda
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      # least-privilege app role (DML only); the migrate service uses the
      # superuser. Override APP_DATABASE_URL in prod with a real app-role URL.
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://kurda_app:kurda_app@postgres:5432/kurda}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Required in production; override in a .env for real deploys (like the
      # postgres password above, this local default is not a real secret).
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me-min-32-chars}
      # No App/Play store credentials in this local stack: use the stub IAP
      # verifier so buildApp() boots (the app's documented dev escape hatch).
      # NEVER set this on a store-facing deployment.
      IAP_ALLOW_STUB: ${IAP_ALLOW_STUB:-true}
      # Sign in with Apple (KUR-276): native token audience = the app bundle id
      APPLE_CLIENT_IDS: app.kurda.mobile
      # Transactional email (KUR-098): put real values in a .env beside this file.
      # Unset secrets fall back to the no-op stub; the port/secure/from defaults
      # keep config validation happy when nothing is configured.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: "${EMAIL_FROM:-MyKurda <no-reply@mykurda.app>}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: npx tsx api/src/workers/main.ts
    # the worker is what actually sends email, so it needs the provider config
    environment:
      # least-privilege app role (DML only); the migrate service uses the superuser
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://kurda_app:kurda_app@postgres:5432/kurda}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me-min-32-chars}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: "${EMAIL_FROM:-MyKurda <no-reply@mykurda.app>}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
