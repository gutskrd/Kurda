# Render Blueprint for the Kurda API (KUR-008 hosting).
#
# One-time setup on render.com (see DEPLOY.md for the full walkthrough):
#   1. Sign in to Render with your GitHub account.
#   2. New → Blueprint → pick the gutskrd/Kurda repo. Render reads this file.
#   3. Apply. It provisions Postgres + a Key Value (Redis) store, builds the
#      Docker image, runs the migrations (preDeployCommand), and starts the API
#      + worker. The API gets a public HTTPS URL like
#      https://kurda-api-XXXX.onrender.com — that URL goes into the mobile
#      build's EXPO_PUBLIC_API_URL.
#
# Plans are `starter`: always-on API, durable Postgres, no idle sleep and no
# time limit. They were `free` while this was a trial deploy; the free Postgres
# was time-limited and would have been deleted.
#
# Keep these in step with the dashboard. A blueprint that still said `free`
# would try to move a paid database back down the next time it is applied, and
# that is not a change anybody makes on purpose.

databases:
  - name: kurda-db
    plan: starter
    databaseName: kurda

services:
  # ---- Redis / Key Value (rate limiting, cache, realtime, job queue) --------
  - type: keyvalue
    name: kurda-redis
    plan: starter
    ipAllowList: [] # internal-only; no public access

  # ---- API (HTTP) -----------------------------------------------------------
  - type: web
    name: kurda-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    # Migrations run at container startup via api/start.sh (migrate, then exec
    # the server). That began as a free-tier necessity — free web services have
    # no `preDeployCommand` — and is kept because it works and is idempotent:
    # moving it now would be a change to how deploys apply schema, for nothing.
    # We run
    # a script rather than an inline `sh -c "... && ..."` chain because Render
    # misparses the chain no matter how it's quoted — a single script path has
    # no shell metacharacters to mangle. node-pg-migrate is idempotent, so the
    # migrate step is a fast no-op once the schema is current, and the API only
    # starts serving after migrations succeed.
    dockerCommand: /bin/sh api/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kurda-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kurda-redis
          property: connectionString
      # a strong random secret, generated once and kept stable by Render
      - key: JWT_SECRET
        generateValue: true
      # Sign in with Apple: the native token audience is the app bundle id
      - key: APPLE_CLIENT_IDS
        value: app.kurda.mobile
      # No App Store / Play credentials yet. This lets the API boot without
      # them; purchases are REFUSED with 503 IAP_UNAVAILABLE until a real
      # verifier is wired, which is the only safe answer an unverified
      # environment can give. Remove the flag once the store credentials land.
      - key: IAP_ALLOW_STUB
        value: "true"
      # Media storage for profile photos (KUR-177/180). S3-compatible; Cloudflare
      # R2 recommended. Set these in the Render dashboard (secrets), then redeploy.
      # Until they're set the API returns 503 MEDIA_UNAVAILABLE for uploads. See
      # DEPLOY.md → "Media storage" for how to get each value.
      # - key: S3_ENDPOINT
      #   sync: false            # https://<account-id>.r2.cloudflarestorage.com
      # - key: S3_REGION
      #   value: auto
      # - key: S3_BUCKET
      #   sync: false            # e.g. mykurda-media
      # - key: S3_ACCESS_KEY_ID
      #   sync: false
      # - key: S3_SECRET_ACCESS_KEY
      #   sync: false
      # - key: CDN_BASE_URL
      #   sync: false            # public r2.dev URL or custom domain

  # ---- Background worker (notifications, schedulers, queues) -----------------
  # Optional, and off. It was off because the free plan has no workers; it stays
  # off because the API already does this job — app.ts runs a worker in-process
  # unless RUN_WORKER_IN_API=false, so the queue has a consumer and verification
  # mail is delivered by the single service.
  #
  # Split it out when job volume starts competing with request latency: push
  # fan-out, GDPR exports and the rollups are the heavy ones. Two things have to
  # happen together, or it is worse than leaving it alone:
  #
  #   1. set RUN_WORKER_IN_API=false on kurda-api, or both consume the same
  #      queue and the schedulers are registered twice
  #   2. put the EMAIL credentials on the WORKER, not just the API. The worker
  #      builds its own provider (jobs/worker.ts → createEmailProvider), so
  #      without them it sends through the stub: jobs succeed, nothing arrives,
  #      and the API's startup warning does not fire because the API is fine.
  # - type: worker
  #   name: kurda-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: standard
  #   dockerCommand: npx tsx api/src/workers/main.ts
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: kurda-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: kurda-redis
  #         property: connectionString
  #     # reuse the API's generated secret so both sign/verify the same tokens
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: kurda-api
  #         envVarKey: JWT_SECRET
  #     # the worker is what actually sends mail once it exists — see above
  #     - key: RESEND_API_KEY
  #       sync: false          # or SMTP_URL / SMTP_HOST instead
  #     - key: EMAIL_FROM
  #       value: MyKurda <no-reply@mykurda.com>
