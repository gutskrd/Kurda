# Render Blueprint for the Kurda API (KUR-008 hosting).
#
# One-time setup on render.com (see DEPLOY.md for the full walkthrough):
#   1. Sign in to Render with your GitHub account.
#   2. New → Blueprint → pick the gutskrd/Kurda repo. Render reads this file.
#   3. Apply. It provisions Postgres + a Key Value (Redis) store, builds the
#      Docker image, runs the migrations (preDeployCommand), and starts the API
#      + worker. The API gets a public HTTPS URL like
#      https://kurda-api-XXXX.onrender.com — that URL goes into the mobile
#      build's EXPO_PUBLIC_API_URL.
#
# Plans are set to `free` so you can bring it up at no cost. Free web services
# sleep after ~15 min idle (first request after is slow) and free Postgres is
# time-limited — bump the three `plan:` lines to `starter` for an always-on,
# durable setup once you're ready to ship.

databases:
  - name: kurda-db
    plan: free
    databaseName: kurda

services:
  # ---- Redis / Key Value (rate limiting, cache, realtime, job queue) --------
  - type: keyvalue
    name: kurda-redis
    plan: free
    ipAllowList: [] # internal-only; no public access

  # ---- API (HTTP) -----------------------------------------------------------
  - type: web
    name: kurda-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Free web services don't support `preDeployCommand`, so run the 81 DB
    # migrations at container startup, before the API begins listening. This
    # overrides the image's default CMD (`npx tsx api/src/server.ts`) to chain
    # the migration step in front of it. node-pg-migrate records which
    # migrations it has applied, so this is idempotent — only new migrations run,
    # and it's a fast no-op on every subsequent boot / wake-from-sleep. The API
    # only starts serving once migrations succeed.
    dockerCommand: sh -c "npm run migrate:up --workspace api && npx tsx api/src/server.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kurda-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kurda-redis
          property: connectionString
      # a strong random secret, generated once and kept stable by Render
      - key: JWT_SECRET
        generateValue: true
      # Sign in with Apple: the native token audience is the app bundle id
      - key: APPLE_CLIENT_IDS
        value: app.kurda.mobile

  # ---- Background worker (notifications, schedulers, queues) -----------------
  # Render's free plan doesn't offer background workers, so this is disabled for
  # the free-tier deploy. Sign-in and the core API don't need it — it only runs
  # background jobs (push notifications, streak reminders, scheduled rollups,
  # queue processing). Re-enable it (uncomment) when moving to paid hosting.
  # - type: worker
  #   name: kurda-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: standard
  #   dockerCommand: npx tsx api/src/workers/main.ts
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: kurda-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: keyvalue
  #         name: kurda-redis
  #         property: connectionString
  #     # reuse the API's generated secret so both sign/verify the same tokens
  #     - key: JWT_SECRET
  #       fromService:
  #         type: web
  #         name: kurda-api
  #         envVarKey: JWT_SECRET
