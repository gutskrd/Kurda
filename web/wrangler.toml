# Cloudflare Worker for the Hevalo web app → hevalo.app.
#
# This deploys the built Vite output in ./dist as static assets, with one small
# Worker script in front of them. SPA deep links are served index.html via
# `not_found_handling`. The API stays on Render; this is not it.
#
# The script exists for one reason: a link to a post, pasted anywhere that
# unfurls links, used to show the same grey "Hevalo — Learn Kurdish" card
# whichever post it was — nothing that unfurls a link runs the JavaScript that
# would set the title. `src/worker.ts` writes the post's own title, author,
# opening lines and picture into the head before the page leaves the edge.
# Everything else is passed through untouched.
#
# `name` is the old brand, and changing it here would not rename anything.
#
# Cloudflare has no rename for a Worker: this name is the identity of the
# deployment target, so editing it would create a *second* Worker called
# "hevalo" with no routes, while "mykurda" carried on serving hevalo.app. The
# site would look untouched and every deploy would go somewhere nobody is
# reading.
#
# Renaming for real means creating the new Worker, moving the hevalo.app route
# and the custom domain onto it, and deleting the old one — a dashboard
# operation with a gap in it, not a line in this file. Until somebody does that
# deliberately, this stays as it is and is only a name in a dashboard: nothing
# a reader of the site can see says "mykurda".
name = "mykurda"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
# AbortSignal.timeout, used to stop a slow API holding a page up
compatibility_flags = ["nodejs_compat"]

[assets]
# relative to this file → web/dist (produced by `vite build`)
directory = "./dist"
# client-side routing: serve index.html (200) for any non-asset path
not_found_handling = "single-page-application"
# the script needs to be able to ask for an asset itself
binding = "ASSETS"

[vars]
# Where post previews are read from. Keep in step with VITE_API_URL.
API_ORIGIN = "https://kurda-api.onrender.com"
