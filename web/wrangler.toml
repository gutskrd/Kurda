# Cloudflare Worker for the Hevalo web app (hevalo.app): the built Vite output in ./dist as static assets, with
# src/worker.ts in front to write link previews into the head; SPA deep links get index.html via `not_found_handling`.
# The API is on Render, not here.
#
# `name` must match the deployed Worker: a name that matches nothing creates a new Worker with no routes, and deploys
# then go nowhere while the real site stays unchanged.
name = "hevalo"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
# AbortSignal.timeout, which stops a slow API holding a page up.
compatibility_flags = ["nodejs_compat"]

[assets]
# Relative to this file: web/dist, produced by `vite build`.
directory = "./dist"
# Client-side routing: serve index.html (200) for any non-asset path.
not_found_handling = "single-page-application"
# The script needs to fetch assets itself.
binding = "ASSETS"

[vars]
# Where post previews are read from. Keep in step with VITE_API_URL.
API_ORIGIN = "https://kurda-api.onrender.com"
