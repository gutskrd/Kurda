<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tab icon carries its own field, because a tab strip is light in one
      browser and dark in the next. The mark is one colour now, so the cut-out
      version disappears into one of them.
    -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- the page's own black, so a phone's browser chrome runs into it rather than framing it -->
    <meta name="theme-color" content="#0b0d10" />
    <title>Hevalo</title>
    <meta
      name="description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <!--
      What a crawler and a link preview see.

      This file is the only HTML the site has: React fills the page in afterwards,
      and nothing that unfurls a link runs React. The worker rewrites these tags
      for a post's own URL (see src/worker.ts); everything else — the landing
      page, the feed, the games — is served exactly this, so it has to stand on
      its own.

      The title is the name and nothing else. The description carries what the
      site is, because that is the line a search result shows, and it is rewritten
      per language once the app knows which one to use.
    -->
    <link rel="canonical" href="https://hevalo.app/" />
    <meta property="og:site_name" content="Hevalo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hevalo.app/" />
    <meta property="og:title" content="Hevalo" />
    <meta
      property="og:description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <!--
      A card, not the bare mark. Whatever unfurls this flattens a transparent
      PNG onto a background of its choosing — usually white, which is exactly
      where a white mark stops existing.
    -->
    <meta property="og:image" content="https://hevalo.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hevalo" />
    <meta
      name="twitter:description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <meta name="twitter:image" content="https://hevalo.app/og.png" />
    <meta property="og:image:alt" content="Hevalo — Learn Kurdish. Play together." />
    <!--
      What the site is, for a search engine that reads structured data: a web
      app for learning Kurdish, published by Zagrosian. Only what is true of the
      product today — no ratings, no prices, no user counts.

      A data block, not a script: it is never executed, so the CSP's
      `script-src 'self'` does not apply to it and it needs no exception.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://hevalo.app/#website",
            "url": "https://hevalo.app/",
            "name": "Hevalo",
            "publisher": { "@id": "https://zagrosian.com/#organization" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://hevalo.app/#app",
            "name": "Hevalo",
            "url": "https://hevalo.app/",
            "description": "Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community.",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web browser",
            "isAccessibleForFree": true,
            "inLanguage": ["en", "ku", "ckb", "nl", "de", "es", "fr", "tr", "ar"],
            "about": { "@type": "Language", "name": "Kurdish", "alternateName": ["Kurmanji", "Kurmancî"] },
            "publisher": { "@id": "https://zagrosian.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://zagrosian.com/#organization",
            "name": "Zagrosian",
            "url": "https://zagrosian.com"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
