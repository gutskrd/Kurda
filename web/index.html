<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page reach a phone's edges so the tab bar sits just above the home indicator; base.css
      keeps content out of the notch, and the bar and chat composer pad with env(safe-area-inset-bottom).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The tab icon carries its own background, since tab strips are light in some browsers and dark in others. -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- The page's own black, so a phone's browser chrome runs into it rather than framing it. -->
    <meta name="theme-color" content="#100e1d" />
    <title>Hevalo</title>
    <meta
      name="description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <!--
      What crawlers and link previews see: this is the site's only HTML, filled in by React, which they do not run.
      src/worker.ts rewrites these tags for posts and listed pages. The title is the name alone; the description, shown in
      search results, is rewritten per language once the app starts.
    -->
    <link rel="canonical" href="https://hevalo.app/" />
    <meta property="og:site_name" content="Hevalo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hevalo.app/" />
    <meta property="og:title" content="Hevalo" />
    <meta
      property="og:description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <!-- A card, not the bare mark: previews flatten transparency onto a background of their choosing, usually white. -->
    <meta property="og:image" content="https://hevalo.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hevalo" />
    <meta
      name="twitter:description"
      content="Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community. Free, in your browser."
    />
    <meta name="twitter:image" content="https://hevalo.app/og.png" />
    <meta property="og:image:alt" content="Hevalo — Learn Kurdish. Play together." />
    <!--
      Structured data for search engines: a web app for learning Kurdish, published by Zagrosian, and only what is true
      today (no ratings, prices or user counts). A data block is never executed, so `script-src 'self'` does not apply.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://hevalo.app/#website",
            "url": "https://hevalo.app/",
            "name": "Hevalo",
            "publisher": { "@id": "https://zagrosian.com/#organization" }
          },
          {
            "@type": "WebApplication",
            "@id": "https://hevalo.app/#app",
            "name": "Hevalo",
            "url": "https://hevalo.app/",
            "description": "Learn Kurdish with your friends: Kurmanji word games, head-to-head challenges, a free Kurdish dictionary and a community.",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web browser",
            "isAccessibleForFree": true,
            "inLanguage": ["en", "ku", "ckb", "nl", "de", "es", "fr", "tr", "ar"],
            "about": { "@type": "Language", "name": "Kurdish", "alternateName": ["Kurmanji", "Kurmancî"] },
            "publisher": { "@id": "https://zagrosian.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://zagrosian.com/#organization",
            "name": "Zagrosian",
            "url": "https://zagrosian.com"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
