name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      docker: ${{ steps.dockerfilter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Root config changes affect every package, so each filter
          # includes the shared toolchain files.
          filters: |
            shared: &root
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - *root
            admin:
              - 'admin/**'
              - *root
            mobile:
              - 'mobile/**'
              - *root
      - uses: dorny/paths-filter@v3
        id: dockerfilter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'api/**'
              - 'shared/**'
              - 'package-lock.json'

  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    name: check (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace ${{ matrix.package }}
      - run: npm run typecheck --workspace ${{ matrix.package }}
      - run: npm run test --workspace ${{ matrix.package }}

  # Dependency vulnerabilities (high+) and leaked secrets block merge.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (high severity blocks)
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Proves the production image builds and the compose file is valid.
  docker-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
      - run: docker compose config -q

  # Runs migrations against a throwaway Postgres and enforces migration
  # immutability. Only when api (or root config) changed.
  migrations:
    needs: changes
    if: contains(needs.changes.outputs.packages, 'api')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kurda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kurda_test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: kurda-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start MinIO (S3-compatible storage for media tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Migration files are immutable once merged
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          changed=$(git diff --name-status --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- 'api/migrations/*.js' 'api/migrations/*.cjs')
          if [ -n "$changed" ]; then
            echo "Migrations are immutable once merged — add a new migration instead:"
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:up --workspace api
      - run: npm run migrate:down --workspace api
      - run: npm run migrate:up --workspace api
      - run: npm run db:seed --workspace api
      # integration tests (skipped without DATABASE_URL) run here against
      # the freshly migrated schema
      - run: npm run test --workspace api

  # Single required status check for branch protection: green when every
  # matrix job passed (or nothing needed checking).
  ci-ok:
    needs: [changes, check, migrations, docker-build, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed."
            exit 1
          fi
          if [ "${{ needs.check.result }}" != "success" ] && [ "${{ needs.check.result }}" != "skipped" ]; then
            echo "A package check failed."
            exit 1
          fi
          if [ "${{ needs.migrations.result }}" != "success" ] && [ "${{ needs.migrations.result }}" != "skipped" ]; then
            echo "Migration checks failed."
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ] && [ "${{ needs.docker-build.result }}" != "skipped" ]; then
            echo "Docker build check failed."
            exit 1
          fi
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "Security checks failed."
            exit 1
          fi
          echo "All checks passed."
